# Dependabot version updates. Security updates are handled separately
# (Settings → Code security). Docs:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # npm — runtime deps are bundled into the VSIX; dev deps are build/test only.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # @types/node must track the Node inside the oldest supported VS Code
      # (engines ^1.101.0 → Node 22.15), not "latest": a newer minor already
      # describes APIs that Node lacks. Hold minor + major; take 22.15.x patches.
      # Bump deliberately together with engines.vscode.
      - dependency-name: "@types/node"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      # @types/vscode must equal engines.vscode (^1.101.0) — vsce package fails
      # if it's higher. Only bump deliberately when raising the min VS Code
      # version. Hold minor + major; patches stay within the same API level.
      - dependency-name: "@types/vscode"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    # Groups take minor/patch only. A group PR is labelled with its largest
    # update, so one major inside a group stops dependabot-auto-merge.yml from
    # merging the routine updates too. Majors arrive as their own PRs instead.
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
        # Pre-1.0 packages get their own PRs: their minor (or 0.0.x patch)
        # updates are held for review by dependabot-auto-merge.yml and would
        # otherwise hold the whole group with them. Add new 0.x deps here.
        exclude-patterns: ["katex", "@vscode/codicons"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
        exclude-patterns: ["@types/katex", "esbuild"]

  # GitHub Actions used by ci.yml / release.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
