name: Release
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Job-level so the step `if` below sees it unambiguously (step-own env
      # visibility inside its own `if` varies by runner version).
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Keep in lockstep with ci.yml — this job re-runs `npm test`, so a
          # Node version jsdom does not support breaks releases even when CI
          # is green. jsdom 30 needs ^22.22 || ^24.15 || >=26; on Node 20 its
          # undici calls worker_threads.markAsUncloneable and every vitest
          # worker dies. Unrelated to @types/node, which tracks VS Code's
          # Electron runtime (20) and governs the shipped extension.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vsce package --no-dependencies
      - name: GitHub release with VSIX
        run: gh release create "$GITHUB_REF_NAME" *.vsix --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --no-dependencies -p "$VSCE_PAT"
