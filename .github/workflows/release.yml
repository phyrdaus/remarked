name: Release
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Keep in lockstep with ci.yml — this job re-runs `npm test`, so a
          # Node version jsdom does not support breaks releases even when CI
          # is green. jsdom 30 needs ^22.22 || ^24.15 || >=26; on Node 20 its
          # undici calls worker_threads.markAsUncloneable and every vitest
          # worker dies. Unrelated to @types/node, which tracks VS Code's
          # Electron runtime (Node 22.15) and governs the shipped extension.
          node-version: 24
          # Runner tool caches can lag security releases (e.g. CVE-2026-111497,
          # fixed in 24.22.1); always resolve the newest 24.x.
          check-latest: true
          cache: npm
      - run: npm ci
      # allowScripts pins exact versions, and Dependabot bumps don't update it.
      # `ls` exits 0 either way, so require its all-clear line (fails closed if
      # the command or its wording changes).
      - name: Check install scripts are approved
        run: npm install-scripts ls | tee /dev/stderr | grep -qx "No packages with unreviewed install scripts."
      - run: npm run typecheck
      - run: npm test
      - run: npx vsce package --no-dependencies
      - name: GitHub release with VSIX
        run: gh release create "$GITHUB_REF_NAME" *.vsix --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  # Publishing is its own job so the only code that runs with Marketplace
  # rights is vsce on an already-built VSIX: no tests, no dependency install
  # scripts. The `marketplace` environment only admits `v*` tags, and the
  # Entra ID federated credential trusts exactly this repo + environment
  # (subject repo:phyrdaus@447795/remarked@1270223966:environment:marketplace).
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      # Only for the vsce pinned in package-lock.json; the VSIX comes from the
      # build job.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix
      - name: Locate VSIX
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/vsix/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one VSIX, found ${#files[@]}"
            exit 1
          fi
          echo "VSIX=${files[0]}" >> "$GITHUB_ENV"

      # Global Azure DevOps PATs stop working on 2026-12-01, so publish with
      # Microsoft Entra ID. Both steps may fail without failing the job; the
      # fallback below then takes over and says so.
      - name: Log in to Microsoft Entra ID
        id: azure
        continue-on-error: true
        # Third-party action in the job that can get a Marketplace token:
        # pinned to a commit, not a movable tag. Dependabot updates the SHA.
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The Marketplace token is tenant-scoped; the app has no subscription.
          allow-no-subscriptions: true
      - name: Publish to Marketplace (Entra ID)
        id: entra
        if: steps.azure.outcome == 'success'
        continue-on-error: true
        # vsce takes the Entra ID token from the Azure CLI session above.
        run: npx vsce publish --azure-credential --packagePath "$VSIX"

      # Remove this step, and the VSCE_PAT secret, once Entra ID has published
      # a release (and no later than 2026-12-01, when the PAT stops working).
      - name: Publish to Marketplace (VSCE_PAT fallback)
        if: steps.entra.outcome != 'success'
        # Step-scoped so no other step in this job can read the PAT.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Entra ID publish did not succeed and VSCE_PAT is not set."
            exit 1
          fi
          echo "::warning::Entra ID publish did not succeed; publishing with VSCE_PAT. Fix the Entra ID setup before 2026-12-01, when the PAT stops working."
          npx vsce publish --packagePath "$VSIX" -p "$VSCE_PAT"
