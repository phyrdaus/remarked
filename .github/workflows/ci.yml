name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # CI toolchain only (runs vitest + jsdom). Independent of the
          # extension's VS Code/Electron runtime, which @types/node pins to 20.
          # jsdom 30 requires Node ^22.22 || ^24.15 || >=26, so 20 crashes on
          # undici's worker_threads.markAsUncloneable.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: xvfb-run -a npm run test:integration
      - run: npx vsce package --no-dependencies
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
