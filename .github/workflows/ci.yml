name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Keep in lockstep with release.yml, which re-runs these same steps.
          # CI toolchain only (runs vitest + jsdom). Independent of the
          # extension's VS Code/Electron runtime, which @types/node pins to 22.15.
          # jsdom 30 requires Node ^22.22 || ^24.15 || >=26, so 20 crashes on
          # undici's worker_threads.markAsUncloneable.
          node-version: 24
          # Runner tool caches can lag security releases (e.g. CVE-2026-111497,
          # fixed in 24.22.1); always resolve the newest 24.x.
          check-latest: true
          cache: npm
      - run: npm ci
      # allowScripts pins exact versions, and Dependabot bumps don't update it.
      # `ls` exits 0 either way, so require its all-clear line (fails closed if
      # the command or its wording changes).
      - name: Check install scripts are approved
        run: npm install-scripts ls | tee /dev/stderr | grep -qx "No packages with unreviewed install scripts."
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: xvfb-run -a npm run test:integration
      - run: npx vsce package --no-dependencies
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
